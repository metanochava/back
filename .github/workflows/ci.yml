name: CI

# Validation only: this application is deployed by hand, never from here.

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL, not SQLite: the inventory/sales concurrency tests use real
    # threads with select_for_update(), which SQLite cannot run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      SQL_ENGINE: postgresql
      SQL_DATABASE: ci
      SQL_USER: ci
      SQL_PASSWORD: ci-only-not-a-secret
      SQL_HOST: localhost
      SQL_PORT: "5432"
      URL_FILE_KEY: ci-only-not-a-secret
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # WeasyPrint (PDF) needs Pango at import time
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt "django_resaas>=0.0.659" pytest pytest-django
      - run: pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # the real migrations, once, on an empty database
      - run: python manage.py migrate --noinput
      # every module's tests (testpaths in pyproject.toml); tables from the models
      - run: python -m pytest --nomigrations -q -rfE

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
