[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Mytech_saas"
version = "1.0.89"
description = "Mytech SAAS Framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
  { name = "Dias Metano Salvador Chavana", email = "metanochava@gmail.com" }
]

dependencies = [
  "django_resaas>=0.0.665",
  # Celery broker client (saas/celery.py, CELERY_BROKER_URL = local Redis)
  "redis>=5",
  "Django==5.2.10",
  "djangorestframework==3.16.1",
  "djangorestframework_simplejwt==5.5.1",
  "drf-writable-nested==0.7.2",
  "Pillow",
  "pyotp",
  "qrcode[pil]>=7.4.2",
  "python-barcode==0.15.1",
  "black",
  "questionary==2.1.1",
  "rich",
  "gunicorn",
  "weasyprint",
  "django-money",
  "python-dotenv",
  "django-cors-headers",
  "psycopg[binary]",
  "django-filter",
]

[project.urls]
Homepage = "https://github.com/metanochava/django_resaas"
Repository = "https://github.com/metanochava/django_resaas"

# 🔥 MUITO IMPORTANTE
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "saas.settings"
testpaths = ["hr", "saude", "inventory", "sales", "farmacia", "purchases", "accounting", "crm", "workflow"]
