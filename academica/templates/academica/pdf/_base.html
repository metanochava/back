<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{ pdf_subject }}</title>
<!-- The academic documents (academica.services.documents_service): A4, the
     school's colour band with its logo and name, then the document. -->
<style>
  @page { size: A4 {% block orientation %}portrait{% endblock %}; margin: 14mm 12mm 16mm; }
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #111827; font-size: 9.5pt; margin: 0; }
  .head { display: flex; align-items: center; gap: 4mm; padding: 4mm 5mm; border-radius: 4mm; background: {{ color }}; color: #fff; }
  .head img { width: 13mm; height: 13mm; border-radius: 50%; background: #fff; padding: 1mm; object-fit: contain; }
  .head .school { font-size: 13pt; font-weight: bold; }
  .head .doc { font-size: 9pt; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.08em; }
  h2 { font-size: 11pt; color: {{ color }}; margin: 5mm 0 2mm; }
  .facts { display: flex; flex-wrap: wrap; gap: 2mm 8mm; margin: 4mm 0; }
  .facts div span { color: #6b7280; }
  table { width: 100%; border-collapse: collapse; margin-top: 2mm; }
  th { background: #f3f4f6; text-align: left; font-weight: 600; }
  th, td { border: 0.2mm solid #e5e7eb; padding: 1.6mm 2mm; }
  td.num, th.num { text-align: center; }
  .ok { color: #047857; font-weight: 600; } .ko { color: #b91c1c; font-weight: 600; } .muted { color: #9ca3af; }
  .foot { margin-top: 6mm; color: #6b7280; font-size: 8pt; }
</style>
</head>
<body>
  <div class="head">
    {% if logo_b64 %}<img src="data:image/png;base64,{{ logo_b64 }}">{% endif %}
    <div><div class="school">{{ entity.name }}</div><div class="doc">{% block title %}{% endblock %}</div></div>
  </div>
  {% block content %}{% endblock %}
  <div class="foot">{{ labels.issued_on }}: {% now "Y-m-d H:i" %}</div>
</body>
</html>
